[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: gerçek Docling/EasyOCR modelleriyle çalışan yavaş testler (ilk çalıştırmada model indirir)
# Üçüncü parti kütüphanelerin, proje kodunu etkilemeyen bilinen uyarıları.
# Tek tek mesajla eşleştirilir; yeni veya projeye ait uyarılar görünmeye devam eder.
# Ayrıntı: TESTING.md > "Test çıktısındaki uyarılar".
filterwarnings =
    ignore:`force_full_page_ocr` is deprecated:DeprecationWarning
    ignore:This field is deprecated. Use `generate_page_images=True`:DeprecationWarning
    ignore:torch.ao.quantization is deprecated:DeprecationWarning
    ignore:torch.quantize_per_tensor:UserWarning
    ignore:'pin_memory' argument is set as true but no accelerator is found:UserWarning
